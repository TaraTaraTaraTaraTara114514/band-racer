- name: Compile watchface
        shell: pwsh
        working-directory: micreate/src
        run: |
          $f = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -Filter *.fprj | Select-Object -First 1
          if (-not $f) {
            Write-Host "No .fprj found. Files in repo:"
            Get-ChildItem -Path $env:GITHUB_WORKSPACE -Recurse -File | Where-Object { $_.FullName -notmatch "micreate|\\.git\\" } | Select-Object -First 60 | ForEach-Object { $_.FullName }
            throw "No .fprj file found in the repo"
          }
          $proj = $f.FullName
          Write-Host "Project: $proj"
          Write-Host ("Images: " + (Get-ChildItem (Join-Path $f.DirectoryName "images") -File).Count)
          $out = "$env:GITHUB_WORKSPACE\output"
          New-Item -ItemType Directory -Force $out | Out-Null
          $log = & .\compiler\compile.exe -b $proj $out SportFace.face 1461256429 2>&1 | Out-String
          Write-Host $log
          if ($log -match "Error:") { throw "compile.exe reported an error, see log above" }
          if (-not (Test-Path "$out\SportFace.face")) { throw "SportFace.face was not produced" }
