name: build-rpk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: unzip -q "band-racer-vela (12).zip"
      - run: npm install
        working-directory: band-racer-vela
      - run: npm run release
        working-directory: band-racer-vela
      - uses: actions/upload-artifact@v4
        with:
          name: band-racer-rpk
          path: band-racer-vela/dist/*.rpk
